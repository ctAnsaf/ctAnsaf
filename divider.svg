<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 14" width="1200" height="14" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" gradientUnits="objectBoundingBox" spreadMethod="repeat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f66c9"/>
      <stop offset="0.5" stop-color="#f0550f"/>
      <stop offset="1" stop-color="#3f66c9"/>
      <animate attributeName="x1" from="0" to="1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="1" to="2" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-2%" y="-300%" width="104%" height="700%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect x="0" y="5" width="1200" height="4" rx="2" fill="url(#g)" filter="url(#glow)" opacity="0.55"/>
  <rect x="0" y="5" width="1200" height="4" rx="2" fill="url(#g)"/>
</svg>
