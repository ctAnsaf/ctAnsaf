<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Ansaf CT – Full Stack Developer</title>
  <defs>
    <filter id="blur" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/></filter>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="400" fill="#08080a"/>

  <g filter="url(#blur)">
    <ellipse cx="120" cy="40" rx="430" ry="270" fill="#23439a">
      <animate attributeName="cx" values="120;230;120" keyTimes="0;0.5;1" dur="16s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      <animate attributeName="cy" values="40;100;40" keyTimes="0;0.5;1" dur="16s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </ellipse>
    <ellipse cx="520" cy="240" rx="360" ry="300" fill="#b9a595" opacity="0.9">
      <animate attributeName="cx" values="520;620;520" keyTimes="0;0.5;1" dur="20s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </ellipse>
    <ellipse cx="1000" cy="260" rx="580" ry="230" fill="#f0550f">
      <animate attributeName="cx" values="1000;900;1000" keyTimes="0;0.5;1" dur="18s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      <animate attributeName="cy" values="260;200;260" keyTimes="0;0.5;1" dur="18s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </ellipse>
    <ellipse cx="1250" cy="20" rx="320" ry="150" fill="#e8500e">
      <animate attributeName="cx" values="1250;1150;1250" keyTimes="0;0.5;1" dur="22s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </ellipse>
    <ellipse cx="1600" cy="340" rx="430" ry="300" fill="#050506">
      <animate attributeName="cx" values="1600;1520;1600" keyTimes="0;0.5;1" dur="17s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </ellipse>
  </g>

  <rect width="1600" height="400" fill="url(#fade)"/>
  <rect width="1600" height="400" filter="url(#grain)" opacity="0.14" style="mix-blend-mode:overlay"/>

  <g filter="url(#shadow)" fill="#fff" font-family="'Google Sans','Segoe UI','Helvetica Neue',Arial,sans-serif">
    <animate attributeName="opacity" from="0" to="1" dur="1.4s" fill="freeze"/>
    <text x="1070" y="222" text-anchor="end" font-size="60" font-weight="700">Ansaf CT</text>
    <rect x="1094" y="148" width="2" height="108" opacity="0.85"/>
    <text x="1120" y="222" font-size="42" font-weight="300">Full Stack Developer</text>
  </g>
</svg>
